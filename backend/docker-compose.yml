name: codebook

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codebook
      POSTGRES_PASSWORD: codebook
      POSTGRES_DB: codebook
    ports:
      - '5436:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codebook -d codebook']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for uploaded PDFs. With no identities configured it accepts any
  # keys, which is fine for local development.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.port=8333 -dir=/data
    ports:
      - '9010:8333'
    volumes:
      - s3data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/']
      interval: 5s
      timeout: 3s
      retries: 20

  # the same image ships the weed shell, so it doubles as the bucket setup job
  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "printf 's3.bucket.create -name codebook\\ns3.bucket.create -name codebook-test\\n' |
             weed shell -master=s3:9333"
    restart: 'no'

  inngest:
    image: inngest/inngest
    # The API app and the eval worker (pnpm evals:worker); the worker is only up while evals run.
    command: inngest dev -u http://host.docker.internal:4000/api/inngest -u http://host.docker.internal:4001/api/inngest
    ports:
      - '8288:8288'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  pgdata:
  s3data:
