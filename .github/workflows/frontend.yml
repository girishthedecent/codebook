name: frontend

on:
  push:
    branches: [main]
    paths:
      [
        "frontend/**",
        "backend/src/openapi/**",
        ".github/workflows/frontend.yml",
      ]
  pull_request:
    paths:
      [
        "frontend/**",
        "backend/src/openapi/**",
        ".github/workflows/frontend.yml",
      ]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # gen:api builds the OpenAPI document from the backend's own registry when no server runs.
      - run: pnpm install --frozen-lockfile
        working-directory: backend

      - run: pnpm lint
      - run: pnpm typecheck

      - name: Generated API types are current
        run: pnpm gen:api && git diff --exit-code src/api/schema.d.ts

      - run: pnpm build
      - run: pnpm size

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 1

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    # Budgets are reported but don't block merges until the first real pages land (F1).
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: frontend/dist

      - run: pnpm lhci
      - run: pnpm lhci:mobile
