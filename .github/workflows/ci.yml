name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codebook
          POSTGRES_PASSWORD: codebook
          POSTGRES_DB: codebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codebook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://codebook:codebook@localhost:5432/codebook
      TEST_DATABASE_URL: postgresql://codebook:codebook@localhost:5432/codebook_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      LIVE_TESTS: "0"
      S3_ENDPOINT: http://localhost:9010
      S3_ACCESS_KEY: codebook
      S3_SECRET_KEY: codebook12345
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      # Storage tests upload real PDFs. A service container can't take a start command, so run it here.
      # (SeaweedFS speaks the S3 API.)
      - name: Start object storage
        working-directory: .
        env:
          AWS_ACCESS_KEY_ID: codebook
          AWS_SECRET_ACCESS_KEY: codebook12345
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name s3 -p 9010:8333 chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9010 && break; sleep 2; done
          aws --endpoint-url http://localhost:9010 s3 mb s3://codebook-test

      - run: pnpm install --frozen-lockfile

      - name: Create test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE codebook_test'

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
