<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CodeBook: ask a book and its code together</title>
    <meta
      name="description"
      content="Put a PDF book, a GitHub repository and a docs page in one workspace and ask questions across them. Every answer cites the page or the lines it came from."
    />
    <link rel="canonical" href="https://codebook.girishthedecent.space/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeBook" />
    <meta property="og:title" content="CodeBook: ask a book and its code together" />
    <meta
      property="og:description"
      content="One question across a book, a repository and a docs page. Each sentence of the answer cites the page or the lines behind it."
    />
    <meta property="og:url" content="https://codebook.girishthedecent.space/" />
    <meta property="og:image" content="https://codebook.girishthedecent.space/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CodeBook: a page of a book and the code that implements it, side by side."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeBook: ask a book and its code together" />
    <meta
      name="twitter:description"
      content="One question across a book, a repository and a docs page, answered with citations you can open."
    />
    <meta name="twitter:image" content="https://codebook.girishthedecent.space/og.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Theme before first paint so there is no flash. Dark unless light or the system was
      // chosen (see lib/theme.ts).
      try {
        var t = localStorage.getItem('codebook.theme');
        if (t !== 'light' && t !== 'system') t = 'dark';
        if (t !== 'system') {
          document.documentElement.dataset.theme = t;
          // A manual choice also decides the browser chrome colour (see lib/theme.ts).
          var c = t === 'dark' ? '#000000' : '#f6f3ec';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = c;
          });
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      // Reading preferences (see lib/prefs.ts), for the same reason: text must not reflow.
      try {
        var s = localStorage.getItem('codebook.textSize');
        if (s === 's' || s === 'l') document.documentElement.dataset.textSize = s;
        if (localStorage.getItem('codebook.measure') === 'wide') {
          document.documentElement.dataset.measure = 'wide';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
