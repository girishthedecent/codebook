# Render blueprint: one web service, the API, which also serves the web app (`pnpm build:web`
# copies the built app next to it). One origin, so the session cookie stays first-party and
# event streams reach the browser as they are written. Values marked `sync: false` are asked
# for when the blueprint is created and never stored in the repository.
#
# BETTER_AUTH_URL and TRUSTED_ORIGINS are the address people open, which is this service's own
# address (or your own domain once one points at it). Render adds a suffix to a service name
# that is already taken, so check the address in the dashboard after creating the service.
services:
  - type: web
    name: decent-codebook-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    # Generated client: gitignored, and a build that reuses cached node_modules skips the
    # install step that normally generates it, so it is generated explicitly.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm prisma generate && pnpm build && pnpm build:web
    # Migrations run first; Prisma takes an advisory lock, so a restart never applies them twice.
    startCommand: pnpm db:deploy && pnpm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22
      # Render's load balancer is the one proxy in front of the API.
      - key: TRUST_PROXY
        value: 1
      - key: BETTER_AUTH_URL
        value: https://decent-codebook-api.onrender.com
      - key: TRUSTED_ORIGINS
        value: https://decent-codebook-api.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: codebook
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: true
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      # The demo's books are openly licensed, so its visitors read them in full, as the owner does.
      - key: DEMO_FULL_BOOKS
        value: true
